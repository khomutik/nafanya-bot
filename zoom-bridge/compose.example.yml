services:
  nafanya-zoom-bridge:
    build: .
    container_name: nafanya-zoom-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./sdk-bot:/opt/nafanya-zoom-sdk-bot:ro
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
