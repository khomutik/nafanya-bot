services:
  nafanya-zoom-bridge:
    build: .
    container_name: nafanya-zoom-bridge
    restart: unless-stopped
    ipc: host
    env_file:
      - .env
    volumes:
      - nafanya-zoom-profile:/home/pwuser/.nafanya-zoom-profile
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nafanya-zoom-profile:
