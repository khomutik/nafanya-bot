# Control agent is separate from zoom-sender and exposes only localhost.
services:
  zoom-control:
    image: node:22-bookworm-slim
    container_name: nafanya-zoom-control
    restart: unless-stopped
    working_dir: /workspace
    command: ["node", "control-agent/main.mjs"]
    env_file:
      - .env
    environment:
      ZOOM_CONTROL_HOST: 0.0.0.0
      ZOOM_CONTROL_PORT: 3098
      ZOOM_CONTROL_PROJECT_DIR: /workspace
      ZOOM_CONTROL_ENV_PATH: /workspace/.env
      ZOOM_CONTROL_PROFILE_DIR: /sender-profile
      ZOOM_CONTROL_DIAGNOSTICS_DIR: /workspace/diagnostics
      ZOOM_CONTROL_HEALTH_URL: http://host.docker.internal:3097/health
    ports:
      - "127.0.0.1:3098:3098"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - zoom-sender-profile:/sender-profile
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro

volumes:
  zoom-sender-profile:
    name: nafanya-zoom-sender_zoom-sender-profile
